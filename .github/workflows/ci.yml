name: CI

# Runs on every push and PR. Nothing here needs Docker: the backend suite uses
# in-memory SQLite with mocked MinIO/Redis/Chroma (see backend/tests/conftest.py),
# and the frontend is type-checked and built with defaults.
on:
  push:
    branches: [main, ameliorations, working-state]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (lint + tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # Lint/format are non-blocking for now: the tree carries a pre-existing
      # style backlog (~376 ruff / ~57 black at CI introduction) that must be
      # burned down separately, not in the same PR that turns CI on. They still
      # run and report, so new debt is visible. Flip continue-on-error off once
      # the backlog is cleared.
      - name: Lint (ruff)
        continue-on-error: true
        run: ruff check .

      - name: Format check (black)
        continue-on-error: true
        run: black --check .

      # Tests are the hard gate: a failure here fails the build.
      - name: Tests (pytest)
        env:
          # conftest also sets throwaway defaults, but being explicit documents
          # that no real secret is needed to run the suite.
          SECRET_KEY: ci-secret-key-not-for-production-0123456789abcdef
          POSTGRES_PASSWORD: ci
          MINIO_ACCESS_KEY: ci
          MINIO_SECRET_KEY: ci
          REDIS_PASSWORD: ""
          RATELIMIT_ENABLED: "false"
        run: pytest -q

  frontend:
    name: Frontend (type-check + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type-check
        run: npm run type-check

      - name: Build
        env:
          # Public defaults so the production build never depends on a local
          # .env.local that does not exist in CI.
          NEXT_PUBLIC_API_URL: http://127.0.0.1:8001
          NEXT_PUBLIC_WS_URL: ws://127.0.0.1:8001
        run: npm run build
