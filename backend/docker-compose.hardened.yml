# ForensicStack — hardened compose overlay
#
#   docker compose -f docker-compose.yml -f docker-compose.hardened.yml up -d
#
# Apply this on top of the base file. It fixes the deployment posture that made
# the sandbox not a sandbox, without you having to rewrite the base file by hand.
#
# What it changes and why
# -----------------------
#
# 1. THE DOCKER SOCKET LEAVES THE WORKER.
#    The base file mounts /var/run/docker.sock into fs_worker, and the executor
#    then passed `--volumes-from fs_worker` to every tool container. That flag
#    inherits *all* mounts of the source container, so each forensic tool got
#    the socket and could create a privileged container with / bind-mounted.
#    A malicious artifact plus one parser bug meant host root, and the
#    --cap-drop=ALL / --read-only flags on the same command line were decorative.
#
#    Here the worker talks to a socket proxy that only exposes the endpoints
#    needed to run a job. Even if the worker is fully compromised it cannot
#    create a privileged container, exec into one, or mount the host.
#
# 2. THE SOURCE TREE IS READ-ONLY.
#    `.:/app:rw` let anything with a write primitive rewrite worker.py or
#    docker_executor.py — and with --reload on the API, get it executed.
#
# 3. INTERNAL SERVICES STOP LISTENING ON 0.0.0.0.
#    Postgres, Redis, MinIO (including its admin console) and ChromaDB were all
#    published to the host. ChromaDB has no authentication whatsoever, so every
#    finding in the system was readable and deletable by anyone who could reach
#    port 8000. Only the API needs to be published.
#
# 4. NO --reload, restart policies, and resource limits on the app containers.

services:
  postgres:
    ports: !override []          # reachable only on the compose network
    restart: unless-stopped

  redis:
    ports: !override []
    restart: unless-stopped
    # Findings and job state must survive a restart.
    command: >
      redis-server --requirepass ${REDIS_PASSWORD}
      --appendonly yes --appendfsync everysec

  minio:
    # Pin: the base file uses `minio/minio` with no tag at all.
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    ports: !override []
    restart: unless-stopped

  chromadb:
    image: chromadb/chroma:0.6.3
    ports: !override []
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "/bin/sh", "-c",
             "exec 3<>/dev/tcp/localhost/8000 && echo -e 'GET /api/v1/heartbeat HTTP/1.0\\r\\n\\r\\n' >&3"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 40s

  # ── Docker socket proxy ────────────────────────────────────────────────────
  # The only container that touches the real socket. Everything is denied by
  # default; we allow exactly what DockerRunner needs to start a job, wait for
  # it and clean it up. Note EXEC=0 and no POST for privileged operations.
  dockerproxy:
    image: tecnativa/docker-socket-proxy:0.3.0
    container_name: fs_docker_proxy
    restart: unless-stopped
    environment:
      CONTAINERS: 1        # inspect / list
      POST: 1              # required to create and start
      IMAGES: 1            # required to resolve the image
      # everything else stays denied
      EXEC: 0
      VOLUMES: 0
      NETWORKS: 0
      SERVICES: 0
      SWARM: 0
      SYSTEM: 0
      INFO: 0
      AUTH: 0
      SECRETS: 0
      CONFIGS: 0
      NODES: 0
      TASKS: 0
      PLUGINS: 0
      DISTRIBUTION: 0
      BUILD: 0
      COMMIT: 0
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - forensicstack

  backend:
    restart: unless-stopped
    # No --reload in a deployed stack: it is a dev watcher, single-process, with
    # dev-mode error surfaces. Two workers so one slow request cannot stall the
    # whole API.
    command: >
      uvicorn forensicstack.api.main:app
      --host 0.0.0.0 --port 8000 --workers 2 --timeout-keep-alive 120
    volumes: !override
      - .:/app:ro
      - tmp_jobs:/app/tmp_jobs
    environment:
      CORS_ALLOW_ORIGINS: ${CORS_ALLOW_ORIGINS:-http://localhost:3000}
      MAX_UPLOAD_BYTES: ${MAX_UPLOAD_BYTES:-5368709120}
    deploy:
      resources:
        limits:
          memory: 2g
    depends_on:
      chromadb:
        condition: service_healthy

  worker:
    restart: unless-stopped
    command: python -m forensicstack.stream_worker --concurrency ${WORKER_CONCURRENCY:-2}
    volumes: !override
      # Source read-only; only the job workspace is writable, and it is the
      # only thing a tool container ever sees.
      - .:/app:ro
      - tmp_jobs:/app/tmp_jobs
      # NOTE: /var/run/docker.sock is deliberately absent.
    environment:
      # Talk to the proxy, never the raw socket.
      DOCKER_HOST: tcp://dockerproxy:2375
      FORENSICSTACK_WORKSPACE: /app/tmp_jobs/work
      FORENSICSTACK_CONCURRENCY: ${WORKER_CONCURRENCY:-2}
      # The daemon sees host paths, not the worker's. Point this at the host
      # directory backing the tmp_jobs volume so bind mounts resolve.
      HOST_WORKSPACE_ROOT: ${HOST_WORKSPACE_ROOT:-}
    depends_on:
      dockerproxy:
        condition: service_started
    deploy:
      resources:
        limits:
          memory: 2g
